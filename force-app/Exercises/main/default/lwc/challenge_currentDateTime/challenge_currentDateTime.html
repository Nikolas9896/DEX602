<template>
    <lightning-card title="Current Date and Time" icon-name="utility:date_time">
                <lightning-button-icon icon-name="utility:refresh" slot="actions" onclick={handleUpdateDateTime}></lightning-button-icon>
                <div class="slds-var-m-left_medium">
                <lightning-formatted-date-time value={currentDateTime} year="numeric" month="numeric" day="numeric" hour="2-digit" minute="2-digit" second="2-digit"
                                       weekday="long" hour12={ampm}></lightning-formatted-date-time>
                </div>
    </lightning-card>
</template>
